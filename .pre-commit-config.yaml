# Pre-commit hooks configuration for Go Fiber Template
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # Go-specific hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: Format Go code
        description: Run gofmt on Go files

      - id: go-imports
        name: Fix Go imports
        description: Run goimports on Go files

      - id: go-vet-mod
        name: Run go vet
        description: Run go vet on Go files

      - id: go-mod-tidy
        name: Tidy Go modules
        description: Run go mod tidy

      - id: go-unit-tests
        name: Run Go unit tests
        description: Run go test on Go files
        args: [-short]

      - id: golangci-lint
        name: Run golangci-lint
        description: Run golangci-lint on Go files

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Remove trailing whitespace

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensure files end with a newline

      - id: check-yaml
        name: Check YAML
        description: Check YAML files for syntax errors

      - id: check-json
        name: Check JSON
        description: Check JSON files for syntax errors

      - id: check-toml
        name: Check TOML
        description: Check TOML files for syntax errors

      - id: check-xml
        name: Check XML
        description: Check XML files for syntax errors

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for merge conflict markers

      - id: check-case-conflict
        name: Check for case conflicts
        description: Check for case-insensitive filename conflicts

      - id: check-added-large-files
        name: Check for large files
        description: Prevent giant files from being committed
        args: ["--maxkb=1000"]

      - id: check-executables-have-shebangs
        name: Check executables have shebangs
        description: Ensure executables have shebangs

      - id: check-shebang-scripts-are-executable
        name: Check shebang scripts are executable
        description: Ensure shebang scripts are executable

      - id: mixed-line-ending
        name: Check line endings
        description: Replace mixed line endings
        args: ["--fix=lf"]

      - id: no-commit-to-branch
        name: Don't commit to main/master
        description: Prevent commits to main/master branches
        args: ["--branch", "main", "--branch", "master"]

  # Markdown hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        description: Run markdownlint on Markdown files
        args: ["--fix"]

  # Security hooks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        description: Detect secrets in code
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json

# Configuration for specific hooks
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
