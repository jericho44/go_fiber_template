# golangci-lint configuration file
# This file configures golangci-lint for the Go Fiber Template project

run:
  # Timeout for analysis
  timeout: 5m

  # Exit code when at least one issue was found
  issues-exit-code: 1

  # Include test files in analysis
  tests: true

  # Targeted Go version
  go: "1.23"

# Output configuration
output:
  # Formats of output: colored-line-number|line-number|json|tab|checkstyle|code-climate|junit-xml|github-actions
  formats:
    - format: colored-line-number

  # Print lines of code with issue
  print-issued-lines: true

  # Print linter name in the end of issue text
  print-linter-name: true

  # Add a prefix to the output file references
  path-prefix: ""

  # Sort results by: filepath, line and column
  sort-results: true

# Linters configuration
linters:
  # Disable all linters as default is true
  disable-all: true

  # Enable specific linters
  enable:
    # Enabled by default linters:
    - errcheck # Check for unchecked errors
    - gosimple # Simplify code
    - govet # Vet examines Go source code
    - ineffassign # Detect ineffectual assignments
    - staticcheck # Static analysis checks
    - typecheck # Type-check Go code
    - unused # Check for unused constants, variables, functions and types

    # Additional useful linters:
    - bodyclose # Check whether HTTP response body is closed successfully
    - contextcheck # Check whether the function uses a non-inherited context
    - cyclop # Check function and package cyclomatic complexity
    - dupl # Tool for code clone detection
    - durationcheck # Check for two durations multiplied together
    - errorlint # Find code that will cause problems with the error wrapping scheme
    - exhaustive # Check exhaustiveness of enum switch statements
    - copyloopvar # Check for pointers to enclosing loop variables
    - forbidigo # Forbid identifiers
    - funlen # Tool for detection of long functions
    - gochecknoglobals # Check that no global variables exist
    - gochecknoinits # Check that no init functions are present
    - gocognit # Compute and check the cognitive complexity of functions
    - goconst # Find repeated strings that could be replaced by a constant
    - gocritic # Provides diagnostics that check for bugs, performance and style issues
    - gocyclo # Compute and check the cyclomatic complexity of functions
    - godot # Check if comments end in a period
    - gofmt # Check whether code was gofmt-ed
    - gofumpt # Check whether code was gofumpt-ed
    - goheader # Check is file header matches to pattern
    - goimports # Check import statements are formatted according to the 'goimport' command
    - mnd # Detect magic numbers
    - gomodguard # Allow and block list linter for direct Go module dependencies
    - goprintffuncname # Check that printf-like functions are named with `f` at the end
    - gosec # Inspect source code for security problems
    - lll # Report long lines
    - makezero # Find slice declarations with non-zero initial length
    - misspell # Find commonly misspelled English words in comments
    - nakedret # Find naked returns in functions greater than a specified function length
    - nestif # Report deeply nested if statements
    - nilerr # Find the code that returns nil even if it checks that the error is not nil
    - nlreturn # Check for a new line before return and branch statements
    - noctx # Find sending http request without context.Context
    - nolintlint # Report ill-formed or insufficient nolint directives
    - prealloc # Find slice declarations that could potentially be preallocated
    - predeclared # Find code that shadows one of Go's predeclared identifiers
    - revive # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - rowserrcheck # Check whether Err of rows is checked successfully
    - sqlclosecheck # Check that sql.Rows and sql.Stmt are closed
    - thelper # Detect golang test helpers without t.Helper() call
    - tparallel # Detect inappropriate usage of t.Parallel() method in your Go test codes
    - unconvert # Remove unnecessary type conversions
    - unparam # Report unused function parameters
    - wastedassign # Find wasted assignment statements
    - whitespace # Tool for detection of leading and trailing whitespace

# Linters settings
linters-settings:
  # Settings for cyclop (cyclomatic complexity)
  cyclop:
    max-complexity: 15
    package-average: 10.0
    skip-tests: false

  # Settings for dupl (code duplication)
  dupl:
    threshold: 100

  # Settings for errcheck
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - io/ioutil.ReadFile
      - io.Copy(*bytes.Buffer)
      - io.Copy(os.Stdout)

  # Settings for exhaustive
  exhaustive:
    check-generated: false
    default-signifies-exhaustive: false

  # Settings for forbidigo
  forbidigo:
    forbid:
      - ^print.*$
      - 'fmt\.Print.*'

  # Settings for funlen (function length)
  funlen:
    lines: 100
    statements: 50

  # Settings for gochecknoglobals
  gochecknoglobals:
    # A list of regexes to exclude global variables from checking
    exclude-functions:
      - main
      - init

  # Settings for gocognit (cognitive complexity)
  gocognit:
    min-complexity: 15

  # Settings for goconst
  goconst:
    min-len: 2
    min-occurrences: 3
    ignore-tests: false
    match-constant: true
    numbers: false
    min: 3
    max: 3

  # Settings for gocritic
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport # https://github.com/go-critic/go-critic/issues/845
      - ifElseChain
      - octalLiteral
      - whyNoLint

  # Settings for gocyclo (cyclomatic complexity)
  gocyclo:
    min-complexity: 15

  # Settings for godot
  godot:
    scope: declarations
    exclude:
      # Exclude links
      - "^[ ]*//[ ]*@"
    capital: false

  # Settings for gofumpt
  gofumpt:
    extra-rules: false

  # Settings for goheader
  goheader:
    values:
      const:
        COMPANY: Go Fiber Template
      regexp:
        AUTHOR: .*
    template: |-
      Copyright (c) {{ YEAR }} {{ COMPANY }}
      Author: {{ AUTHOR }}

  # Settings for goimports
  goimports:
    local-prefixes: go-fiber-template

  # Settings for gomnd (magic numbers)
  gomnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return
      - assign
    ignored-numbers:
      - "0"
      - "1"
      - "2"
      - "3"
      - "10"
      - "100"
      - "1000"
    ignored-functions:
      - "math.*"
      - "http.StatusText"
      - "make"

  # Settings for gomodguard
  gomodguard:
    allowed:
      modules: []
      domains: []
    blocked:
      modules: []
      versions: []

  # Settings for gosec
  gosec:
    severity: "low"
    confidence: "low"
    excludes:
      - G204 # Subprocess launched with variable
      - G304 # File path provided as taint input
    exclude-generated: true

  # Settings for lll (line length limit)
  lll:
    line-length: 120
    tab-width: 1

  # Settings for misspell
  misspell:
    locale: US
    ignore-words:
      - someword

  # Settings for nakedret
  nakedret:
    max-func-lines: 30

  # Settings for nestif
  nestif:
    min-complexity: 4

  # Settings for nlreturn
  nlreturn:
    block-size: 1

  # Settings for nolintlint
  nolintlint:
    allow-leading-space: true
    allow-unused: false
    require-explanation: false
    require-specific: false

  # Settings for prealloc
  prealloc:
    simple: true
    range-loops: true
    for-loops: false

  # Settings for revive
  revive:
    min-confidence: 0
    rules:
      - name: atomic
      - name: line-length-limit
        arguments: [120]
      - name: argument-limit
        arguments: [4]
      - name: cyclomatic
        arguments: [15]
      - name: max-public-structs
        arguments: [3]
      - name: file-header
        disabled: true

  # Settings for unparam
  unparam:
    check-exported: false

  # Settings for unused
  unused:
    check-exported: false

  # Settings for whitespace
  whitespace:
    multi-if: false
    multi-func: false

# Issues configuration
issues:
  # List of regexps of issue texts to exclude
  exclude:
    # Exclude some linters from running on tests files
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*print(f|ln)?|os\\.(Un)?Setenv). is not checked"
    - "should have a package comment, unless it's in another file for this package"
    - "don't use an underscore in package name"

  # Excluding configuration per-path, per-linter, per-text and per-source
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gomnd
        - goconst
        - funlen
        - lll
        - dupl
        - gosec
        - gochecknoglobals
        - gochecknoinits

    # Exclude some linters from running on example files
    - path: examples/
      linters:
        - gomnd
        - goconst
        - funlen
        - lll
        - dupl
        - gosec
        - gochecknoglobals
        - gochecknoinits

    # Exclude some linters from running on migration files
    - path: migrations/
      linters:
        - lll

    # Exclude some linters from running on main files
    - path: cmd/
      linters:
        - gochecknoinits

    # Exclude some linters from running on generated files
    - path: docs/
      linters:
        - lll
        - gomnd
        - goconst

  # Independently of option `exclude` we use default exclude patterns,
  # it can be disabled by this option. To list all
  # excluded by default patterns execute `golangci-lint run --help`.
  exclude-use-default: false

  # The default value is false. If set to true exclude and exclude-rules
  # regular expressions become case sensitive.
  exclude-case-sensitive: false

  # The list of ids of default excludes to include or disable. By default it's empty.
  include:
    - EXC0002 # disable excluding of issues about comments from golint

  # Maximum issues count per one linter. Set to 0 to disable. Default is 50.
  max-issues-per-linter: 0

  # Maximum count of issues with the same text. Set to 0 to disable. Default is 3.
  max-same-issues: 0

  # Show only new issues: if there are unstaged changes or untracked files,
  # only those changes are analyzed, else only changes in HEAD~ are analyzed.
  new: false

  # Show only new issues created after git revision `REV`
  new-from-rev: ""

  # Show only new issues created in git patch with set file path.
  new-from-patch: ""

  # Fix found issues (if it's supported by the linter)
  fix: false

severity:
  # Default value is empty string.
  # Set the default severity for issues. If severity rules are defined and the issues
  # do not match or no severity is provided to the rule this will be the default
  # severity applied. Severities should match the supported severity names of the
  # selected out format.
  # - Code climate: https://docs.codeclimate.com/docs/issues#issue-severity
  # - Checkstyle: https://checkstyle.sourceforge.io/property_types.html#severity
  # - Github: https://help.github.com/en/actions/reference/workflow-commands-for-github-actions#setting-an-error-message
  default-severity: error

  # The default value is false.
  # If set to true severity-rules regular expressions become case sensitive.
  case-sensitive: false

  # Default value is empty list.
  # When a list of severity rules are provided, severity information will be added to lint
  # issues. Severity rules have the same filtering capability as exclude rules except you
  # are allowed to specify one matcher per severity rule.
  rules:
    - linters:
        - dupl
      severity: info
