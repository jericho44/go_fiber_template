basePath: /api/v1
definitions:
  controllers.AuthResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
      user: {}
    type: object
  controllers.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  controllers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  controllers.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  controllers.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 1
        type: string
      last_name:
        maxLength: 100
        minLength: 1
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    type: object
  controllers.UpdateUserProfileRequest:
    properties:
      first_name:
        maxLength: 100
        minLength: 1
        type: string
      is_active:
        type: boolean
      last_name:
        maxLength: 100
        minLength: 1
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        maxLength: 100
        minLength: 1
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      last_name:
        maxLength: 100
        minLength: 1
        type: string
      updated_at:
        type: string
    required:
    - email
    - first_name
    - last_name
    type: object
  utils.APIError:
    properties:
      code:
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  utils.APIResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/utils.APIError'
      message:
        type: string
      meta:
        $ref: '#/definitions/utils.Meta'
      success:
        type: boolean
    type: object
  utils.Meta:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: "A comprehensive Go web application template using the Fiber framework
    with essential features including API documentation, database management, structured
    response handling, clean architecture patterns, and secure authentication.\n\n##
    \U0001F680 Quick Start Guide\n\n### 1. Authentication Flow\nThis API uses JWT
    (JSON Web Token) for authentication. Follow these steps to get started:\n\n**Step
    1: Register or Login**\n- **Register**: Use `POST /auth/register` to create a
    new account\n- **Login**: Use `POST /auth/login` with existing credentials\n\n**Step
    2: Authorize in Swagger**\n1. Copy the `access_token` from the login/register
    response\n2. Click the **\"Authorize\"** button at the top of this page\n3. Enter:
    `Bearer {your-access-token}` (replace with your actual token)\n4. Click **\"Authorize\"**
    to save the token\n\n**Step 3: Test Protected Endpoints**\n- All User Management
    endpoints now include your authorization automatically\n- Try the `GET /users`
    endpoint to list users\n\n**Step 4: Token Management**\n- **Access tokens expire
    in 15 minutes** - use `POST /auth/refresh` to get new tokens\n- **Logout** using
    `POST /auth/logout` to invalidate tokens when done\n\n### 2. Example Authentication
    Flow\n```\n1. POST /auth/register → Get access_token and refresh_token\n2. Click
    \"Authorize\" → Enter \"Bearer {access_token}\"\n3. Test protected endpoints (GET
    /users, PUT /users/{id}, etc.)\n4. When token expires → POST /auth/refresh with
    refresh_token\n5. POST /auth/logout → Clean logout and token invalidation\n```\n\n##
    \U0001F4CB API Response Format\nAll API responses follow a consistent structure
    for predictable client integration:\n\n**Success Response:**\n```json\n{\n\"success\":
    true,\n\"message\": \"Operation successful\",\n\"data\": { ... },\n\"error\":
    null,\n\"meta\": { ... }\n}\n```\n\n**Error Response:**\n```json\n{\n\"success\":
    false,\n\"message\": \"Request failed\",\n\"data\": null,\n\"error\": {\n\"code\":
    \"VALIDATION_ERROR\",\n\"message\": \"Validation failed\",\n\"details\": { \"email\":
    \"Email is required\" }\n},\n\"meta\": null\n}\n```\n\n## ⚠️ Error Handling\nThe
    API uses standard HTTP status codes and provides detailed error information:\n\n**Common
    Error Codes:**\n- `VALIDATION_ERROR` (400): Request validation failed\n- `UNAUTHORIZED`
    (401): Invalid credentials or expired token\n- `FORBIDDEN` (403): Access denied\n-
    `NOT_FOUND` (404): Resource not found\n- `CONFLICT` (409): Resource already exists
    (e.g., email already registered)\n- `INTERNAL_ERROR` (500): Server error\n\n**Error
    Response Fields:**\n- `success`: Always `false` for errors\n- `message`: Always
    \"Request failed\" for errors\n- `error.code`: Specific error code for programmatic
    handling\n- `error.message`: Human-readable error message\n- `error.details`:
    Field-specific validation errors (when applicable)\n\n## \U0001F4C4 Pagination\nList
    endpoints support pagination with consistent query parameters:\n\n**Query Parameters:**\n-
    `page`: Page number (default: 1, minimum: 1)\n- `limit`: Items per page (default:
    10, minimum: 1, maximum: 100)\n\n**Pagination Response:**\n```json\n{\n\"success\":
    true,\n\"message\": \"Users retrieved successfully\",\n\"data\": [ ... ],\n\"meta\":
    {\n\"page\": 1,\n\"limit\": 10,\n\"total\": 100,\n\"total_pages\": 10\n}\n}\n```\n\n##
    \U0001F50D Search and Filtering\nUser endpoints support advanced search and filtering:\n\n**Search
    Parameters:**\n- `search`: Search in first_name, last_name, and email fields\n-
    `is_active`: Filter by user active status (true/false)\n- `sort_by`: Sort field
    (id, email, first_name, last_name, is_active, created_at, updated_at)\n- `sort_order`:
    Sort direction (asc, desc)\n\n**Example:** `GET /users?search=john&is_active=true&sort_by=created_at&sort_order=desc`\n\n##
    \U0001F510 Security Features\n- **JWT Authentication**: Secure token-based authentication\n-
    **Password Hashing**: Bcrypt encryption for user passwords\n- **Token Blacklisting**:
    Secure logout with token invalidation\n- **Input Validation**: Comprehensive request
    validation\n- **Rate Limiting**: API rate limiting to prevent abuse\n- **CORS
    Support**: Configurable cross-origin resource sharing"
