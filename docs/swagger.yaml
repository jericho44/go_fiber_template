    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Fiber Template API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password. Returns JWT access and
        refresh tokens on successful authentication.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with authentication tokens
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/controllers.AuthResponse'
              type: object
        "400":
          description: Invalid request body or validation errors
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Invalid credentials
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      summary: Login user
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate user tokens and logout. Requires valid JWT token in
        Authorization header. Optionally accepts refresh token in request body for
        complete logout.
      parameters:
      - description: Bearer JWT access token
        format: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: Optional logout request with refresh token
        in: body
        name: request
        schema:
          $ref: '#/definitions/controllers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Invalid request body
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Invalid or missing authorization header
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Generate a new access token using a valid refresh token. The refresh
        token must not be expired or blacklisted.
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully with new access token
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "400":
          description: Invalid request body or validation errors
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Invalid or expired refresh token
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password. Password must
        be at least 8 characters long.
      parameters:
      - description: Registration request with user details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully with authentication tokens
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/controllers.AuthResponse'
              type: object
        "400":
          description: Invalid request body or validation errors
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "409":
          description: Email already exists
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      summary: Register a new user
      tags:
      - Authentication
  /users:
    get:
      consumes:
      - application/json
      description: Get a paginated list of users with optional filtering and sorting.
        Requires valid JWT token for authentication.
      parameters:
      - description: 'Page number (default: 1)'
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 'Items per page (default: 10, max: 100)'
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: Search term for name or email
        in: query
        name: search
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - description: Sort field
        enum:
        - id
        - email
        - first_name
        - last_name
        - is_active
        - created_at
        - updated_at
        in: query
        name: sort_by
        type: string
      - description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: sort_order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Users retrieved successfully with pagination metadata
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.User'
                  type: array
                meta:
                  $ref: '#/definitions/utils.Meta'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a user by ID. This performs a soft delete, marking
        the user as deleted without removing the record. Requires valid JWT token
        for authentication.
      parameters:
      - description: User ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/utils.APIResponse'
        "400":
          description: Invalid user ID
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "404":
          description: User not found
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Get user profile information by ID. Requires valid JWT token for
        authentication.
      parameters:
      - description: User ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid user ID
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "404":
          description: User not found
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update user profile information. All fields are optional. Requires
        valid JWT token for authentication.
      parameters:
      - description: User ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: Update profile request with optional fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/controllers.UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: User profile updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.User'
              type: object
        "400":
          description: Invalid user ID, request body, or validation errors
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "401":
          description: Unauthorized - invalid or missing JWT token
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "404":
          description: User not found
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/utils.APIResponse'
            - properties:
                error:
                  $ref: '#/definitions/utils.APIError'
              type: object
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: 'Type "Bearer" followed by a space and JWT token. Example: "Bearer
      eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
